name: CI

on:
  # Branches run through pull_request only; push runs only on main and tags (avoids double runs).
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the PR's previous run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # MINVER-1: minimum PHP 8.5; 8.6 (release 19.11.2026) is tested but may fail until setup-php ships it.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        experimental: [false]
        include:
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Syntax check
        run: composer lint
      - name: Plugin metadata
        run: php bin/check-plugin-meta.php
      - name: Hook reference up to date
        run: php bin/list-hooks.php --check
      - name: Translations complete, placeholders consistent, .mo/.json up to date
        run: php bin/compile-translations.php --check
      - name: Unit tests
        run: vendor/bin/phpunit

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2, cs2pr
      - run: composer install --no-interaction --no-progress
      - run: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true && composer global require --no-interaction wp-coding-standards/wpcs:^3.1 phpcompatibility/phpcompatibility-wp:^2.1
      - run: ~/.composer/vendor/bin/phpcs -q --report=checkstyle | cs2pr
        continue-on-error: true # Report only until the baseline is clean (see RC-033 notes).

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: review-captain-zip
          path: build/*.zip

  db-integration:
    # MINVER-1 / TEC-005 / TEC-014: real MySQL 9.7 LTS and MariaDB 12.3 LTS (install, schema upgrade, race tests).
    name: ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MariaDB 12.3', image: 'mariadb:12.3', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { name: 'MySQL 9.7', image: 'mysql:9.7', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_ci
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, mysqli, mbstring
          coverage: none
          tools: composer:v2
      - name: Install, upgrade v2→v3, race tests
        env:
          DB_HOST: 127.0.0.1:3306
          CI_DIR: ${{ runner.temp }}/rc-ci
        run: tests/e2e/ci-db.sh
