<rect x="185" y="603" width="698" height="151" class="panel"/><text x="203" y="632" class="ink h2">Fairness und Deduplizierung</text><text x="203" y="661" class="ink small">✓ Maximal 1 Einladung je Erlebnis-ID und Empfänger</text><text x="203" y="687" class="ink small">✓ Ziel wird vorher festgelegt und für alle gleich angewandt</text><text x="203" y="713" class="ink small">✓ Kein Sterne-/Stimmungsfilter · Refund, Absage und Opt-out prüfen</text><text x="203" y="738" class="muted tiny">Form Captain kann separat einen moderationspflichtigen Review-Entwurf liefern.</text>
