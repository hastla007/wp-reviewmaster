<rect x="248" y="0" width="1032" height="72" fill="#fff"/><text x="275" y="31" class="muted small">Review Captain  /  Quellen &amp; Profile</text><text x="275" y="56" class="ink h2">Plattformen verbinden</text><text x="275" y="101" class="muted small">Verbinde nur Profile, die du verwaltest. Verfügbarkeit und Umfang hängen von deinem Plattformkonto ab.</text>
<rect x="270" y="126" width="600" height="114" rx="12" class="card"/><circle cx="307" cy="164" r="17" fill="#4285f4"/><text x="300" y="169" class="white small" font-weight="700">G</text><text x="339" y="158" class="ink h3">Google Business Profile</text><text x="339" y="182" class="muted small">OAuth · verifizierte Standorte · Review-Sync</text><rect x="742" y="145" width="104" height="34" rx="8" fill="#1685cf"/><text x="761" y="167" class="white small" font-weight="700">Verbinden</text><text x="292" y="215" class="muted tiny">Google Places-Fallback separat; eingeschränkter Umfang und mögliche API-Kosten.</text>
<rect x="270" y="254" width="600" height="114" rx="12" class="card"/><circle cx="307" cy="292" r="17" fill="#00a67d"/><text x="298" y="297" class="white small" font-weight="700">★</text><text x="339" y="286" class="ink h3">Trustpilot</text><text x="339" y="310" class="muted small">API-Recht erforderlich · offizieller TrustBox-Fallback möglich</text><rect x="742" y="273" width="104" height="34" rx="8" fill="#fff"/><rect x="742" y="273" width="104" height="34" rx="8" fill="none" stroke="#1685cf"/><text x="759" y="295" class="blue small" font-weight="700">Einrichten</text><text x="292" y="345" class="muted tiny">Review-Sync und Einladungs-API sind getrennte Fähigkeiten.</text>
<rect x="270" y="382" width="600" height="114" rx="12" class="card"/><circle cx="307" cy="420" r="17" fill="#e3a200"/><text x="302" y="425" class="white small" font-weight="700">T</text><text x="339" y="414" class="ink h3">Trusted Shops / eTrusted</text><text x="339" y="438" class="muted small">API-Client und Kanal des berechtigten Shops</text><rect x="742" y="401" width="104" height="34" rx="8" fill="#fff"/><rect x="742" y="401" width="104" height="34" rx="8" fill="none" stroke="#1685cf"/><text x="759" y="423" class="blue small" font-weight="700">Einrichten</text><text x="292" y="473" class="muted tiny">Alternativ offizielles Widget/Trustbadge oder Profil-Link.</text>
<rect x="270" y="510" width="600" height="114" rx="12" class="card"/><circle cx="307" cy="548" r="17" fill="#333"/><text x="298" y="553" class="white small" font-weight="700">A</text><text x="339" y="542" class="ink h3">Apple App Store</text><text x="339" y="566" class="muted small">App Store Connect API · eigene verwaltete App</text><rect x="742" y="529" width="104" height="34" rx="8" fill="#fff"/><rect x="742" y="529" width="104" height="34" rx="8" fill="none" stroke="#1685cf"/><text x="759" y="551" class="blue small" font-weight="700">Einrichten</text><text x="292" y="601" class="muted tiny">Team-ID, App-ID und API-Key bleiben beim Betreiber.</text>
<rect x="270" y="638" width="600" height="114" rx="12" class="card"/><circle cx="307" cy="676" r="17" fill="#34a853"/><text x="298" y="681" class="white small" font-weight="700">▶</text><text x="339" y="670" class="ink h3">Google Play</text><text x="339" y="694" class="muted small">Android Publisher API · eigene Play-Console-App</text><rect x="742" y="657" width="104" height="34" rx="8" fill="#fff"/><rect x="742" y="657" width="104" height="34" rx="8" fill="none" stroke="#1685cf"/><text x="759" y="679" class="blue small" font-weight="700">Einrichten</text><text x="292" y="729" class="muted tiny">Nur berechtigte Konten können eigene App-Reviews verbinden.</text>
<rect x="892" y="126" width="354" height="310" rx="12" class="card"/><text x="916" y="160" class="ink h3">Verbindungsprinzip</text><text x="916" y="194" class="ink small">1. Plattform auswählen</text><text x="916" y="220" class="muted small">2. Kontozugriff prüfen</text><text x="916" y="246" class="muted small">3. Profile/Apps auswählen</text><text x="916" y="272" class="muted small">4. Testverbindung ausführen</text><text x="916" y="298" class="muted small">5. Sync und Regeln festlegen</text><line x1="916" y1="318" x2="1220" y2="318" class="line"/><text x="916" y="348" class="ink small" font-weight="700">Keine gültige API-Berechtigung?</text><text x="916" y="374" class="muted small">Offizielles Embed, Profil-Link oder</text><text x="916" y="396" class="muted small">manuelle Auswahl statt Scraping.</text>
