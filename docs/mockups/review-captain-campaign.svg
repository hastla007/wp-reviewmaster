<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-label="Review Captain Einladungskampagne Mockup">
<defs><style>
*{font-family:Inter,Arial,sans-serif}.bg{fill:#f3f6fa}.nav{fill:#102f50}.card{fill:#fff;stroke:#e2e9f0;stroke-width:1}.muted{fill:#73849a}.ink{fill:#20364e}.blue{fill:#1685cf}.green{fill:#16835d}.line{stroke:#e8edf3;stroke-width:1}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.h2{font-size:21px;font-weight:700}.h3{font-size:15px;font-weight:700}.white{fill:#fff}.tag{fill:#e9f7f0}.tagBlue{fill:#eaf4fb}.radio{fill:#fff;stroke:#b4c1cf;stroke-width:1.5}
</style></defs>
<rect class="bg" width="1280" height="820"/><rect class="nav" width="230" height="820"/>
<text x="28" y="42" class="white" font-size="20" font-weight="700">★ Review Captain</text><text x="31" y="129" class="white body" opacity=".82">◧  Übersicht</text><text x="31" y="173" class="white body" opacity=".82">☆  Reviews</text><rect x="15" y="195" width="200" height="40" rx="8" fill="#1d4a70"/><text x="48" y="221" class="white body" font-weight="700">↗  Anfragen</text><text x="31" y="273" class="white body" opacity=".82">◎  Quellen</text><text x="31" y="317" class="white body" opacity=".82">▣  Widgets</text><text x="31" y="361" class="white body" opacity=".82">✦  Testimonials</text><text x="31" y="405" class="white body" opacity=".82">⌘  Suite-Integrationen</text><text x="31" y="449" class="white body" opacity=".82">⚙  Einstellungen</text>
<rect x="248" y="0" width="1032" height="72" fill="#fff"/><text x="275" y="31" class="muted small">Review Captain  /  Anfragen  /  Neue Kampagne</text><text x="275" y="56" class="ink h2">Erlebnis-Anfrage einrichten</text>
<rect x="270" y="92" width="976" height="66" rx="12" class="card"/><circle cx="304" cy="125" r="17" fill="#1685cf"/><text x="299" y="130" class="white small" font-weight="700">1</text><text x="335" y="121" class="ink h3">Auslöser</text><text x="435" y="121" class="muted small">→ Empfänger</text><text x="575" y="121" class="muted small">→ Ziel</text><text x="675" y="121" class="muted small">→ Nachricht</text><text x="817" y="121" class="muted small">→ Prüfen &amp; aktivieren</text>
<rect x="270" y="176" width="600" height="310" rx="12" class="card"/><text x="293" y="211" class="ink h3">Wann hat das Erlebnis stattgefunden?</text><text x="293" y="235" class="muted small">Auslöser wird vom jeweils zuständigen Suite-Plugin gemeldet.</text>
<rect x="292" y="256" width="556" height="52" rx="8" fill="#eaf4fb" stroke="#b7d9f3"/><circle cx="315" cy="282" r="8" fill="#1685cf"/><text x="338" y="278" class="ink body" font-weight="700">Pass Captain · gültiger Check-in</text><text x="338" y="297" class="muted tiny">Erlebnisinhaber: Pass Captain · attendee_id wird zur Versandzeit aufgelöst</text>
<rect x="292" y="318" width="556" height="52" rx="8" fill="#fff" stroke="#e2e9f0"/><circle cx="315" cy="344" r="8" class="radio"/><text x="338" y="340" class="ink body">Voucher Captain · Gutschein eingelöst</text><text x="338" y="359" class="muted tiny">Keine Anfrage bei Ausstellung oder bloßem Kauf</text>
<rect x="292" y="380" width="556" height="52" rx="8" fill="#fff" stroke="#e2e9f0"/><circle cx="315" cy="406" r="8" class="radio"/><text x="338" y="402" class="ink body">WooCommerce · erfüllte Bestellung</text><text x="338" y="421" class="muted tiny">Nur nach definiertem Status und erlaubter Empfängerprüfung</text>
<rect x="292" y="442" width="556" height="30" rx="8" fill="#fff" stroke="#e2e9f0"/><circle cx="315" cy="457" r="8" class="radio"/><text x="338" y="462" class="ink small">Form Captain · Opt-in-Einsendung als Review-Entwurf</text>
<rect x="892" y="176" width="354" height="310" rx="12" class="card"/><text x="916" y="211" class="ink h3">Versandregeln</text><text x="916" y="246" class="muted small">Verzögerung</text><rect x="916" y="258" width="302" height="38" rx="7" fill="#f8fafc" stroke="#dfe6ee"/><text x="931" y="282" class="ink small">2 Tage nach Abschluss</text><text x="916" y="326" class="muted small">Empfänger</text><rect x="916" y="338" width="302" height="38" rx="7" fill="#f8fafc" stroke="#dfe6ee"/><text x="931" y="362" class="ink small">Teilnehmer / tatsächlicher Nutzer</text><text x="916" y="406" class="muted small">Versand</text><rect x="916" y="418" width="302" height="42" rx="7" fill="#f8fafc" stroke="#dfe6ee"/><text x="931" y="444" class="ink small">Betreiber-eigener SMTP / Dienst</text>
<rect x="270" y="504" width="976" height="188" rx="12" class="card"/><text x="293" y="539" class="ink h3">Einladungsziel und Fairnessregeln</text>
<circle cx="306" cy="574" r="7" fill="#1685cf"/><text x="326" y="579" class="ink small">1 Einladung pro tatsächlichem Erlebnis und Empfänger</text>
<circle cx="306" cy="607" r="7" fill="#1685cf"/><text x="326" y="612" class="ink small">Zielplattform wird vorab festgelegt und für alle geeigneten Empfänger gleich angewendet</text>
<circle cx="306" cy="640" r="7" fill="#1685cf"/><text x="326" y="645" class="ink small">Kein Sterne- oder Stimmungsfilter · Opt-out und Refund prüfen wir direkt vor Versand</text>
<circle cx="306" cy="673" r="7" fill="#1685cf"/><text x="326" y="678" class="ink small">Anbieter-Einladung nur mit aktivem Kontorecht, sonst neutrale Betreiber-E-Mail</text>
<rect x="1046" y="722" width="200" height="42" rx="8" fill="#1685cf"/><text x="1084" y="749" class="white body" font-weight="700">Testen &amp; speichern</text><text x="270" y="799" class="muted tiny">UI-Mockup · illustrative Werte und Schritte</text>
</svg>