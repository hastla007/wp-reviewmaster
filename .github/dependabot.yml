# Dependabot: daily at a fixed time, one grouped PR per ecosystem, security updates separately,
# at most two open PRs per ecosystem (keeps the shared Actions queue free).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
      composer:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
