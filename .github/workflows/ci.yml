name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Syntax check
        run: composer lint
      - name: Plugin metadata
        run: php bin/check-plugin-meta.php
      - name: Hook reference up to date
        run: php bin/list-hooks.php --check
      - name: Unit tests
        run: vendor/bin/phpunit

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
      - run: composer install --no-interaction --no-progress
      - run: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true && composer global require --no-interaction wp-coding-standards/wpcs:^3.1 phpcompatibility/phpcompatibility-wp:^2.1
      - run: ~/.composer/vendor/bin/phpcs -q --report=checkstyle | cs2pr
        continue-on-error: true # Report only until the baseline is clean (see RC-033 notes).

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: review-captain-zip
          path: build/*.zip
